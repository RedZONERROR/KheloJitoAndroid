plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.app.khelojito'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.app.khelojito"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty('KHELOJITO_KEYSTORE_FILE') ?: 'khelojito.jks')
            storePassword project.findProperty('KHELOJITO_KEYSTORE_PASSWORD') ?: 'KheloJito@2026'
            keyAlias project.findProperty('KHELOJITO_KEY_ALIAS') ?: 'khelojito'
            keyPassword project.findProperty('KHELOJITO_KEY_PASSWORD') ?: 'KheloJito@2026'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        debug {
            storeFile file(project.findProperty('KHELOJITO_KEYSTORE_FILE') ?: 'khelojito.jks')
            storePassword project.findProperty('KHELOJITO_KEYSTORE_PASSWORD') ?: 'KheloJito@2026'
            keyAlias project.findProperty('KHELOJITO_KEY_ALIAS') ?: 'khelojito'
            keyPassword project.findProperty('KHELOJITO_KEY_PASSWORD') ?: 'KheloJito@2026'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}